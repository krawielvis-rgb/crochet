<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sara Rain Crochet — Admin</title><style>:root{--ink:#21312c;--cream:#f7f4ed;--paper:#fff;--rose:#9b5148;--line:#ddd4c8}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:30px 20px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font:600 25px Georgia,serif}.top button{background:none;border:1px solid var(--line);padding:10px 14px;border-radius:6px;cursor:pointer}.panel{background:var(--paper);border:1px solid var(--line);padding:28px;margin-bottom:20px}.login{max-width:500px;margin:8vh auto}.h{font:500 42px/1.05 Georgia,serif;margin:0 0 10px}.muted{color:#66716b}.upload{border:1px dashed #b9afa4;padding:30px;text-align:center;border-radius:8px;background:#fcfaf7}.upload input{margin-top:12px}label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}input,textarea{width:100%;border:1px solid #cfc6bb;background:#fff;padding:12px;font:inherit;color:var(--ink);border-radius:5px}textarea{min-height:430px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.55}.primary{background:var(--ink);color:white;border:0;padding:14px 20px;border-radius:5px;font-weight:700;cursor:pointer}.primary:disabled{opacity:.55;cursor:not-allowed}.status{padding:12px;margin-top:15px;background:#f0ebe4}.hidden{display:none}.preview{display:none;width:100%;max-height:520px;object-fit:contain;margin:18px auto 0;border:1px solid var(--line)}.hint{font-size:13px;color:#66716b;line-height:1.6;margin:8px 0 0}.success{background:#e7f0e9}.error{background:#f3e5e1}@media(max-width:700px){.panel{padding:20px}.h{font-size:36px}}</style></head><body><div id="app" class="wrap"><div class="panel login"><div class="muted">SARA RAIN CROCHET · PRIVATE</div><h1 class="h">Admin login</h1><p class="muted">Sign in with the admin username or email and password.</p><form id="loginForm"><label>Username or email</label><input id="identifier" autocomplete="username" required><label style="margin-top:15px">Password</label><input id="password" type="password" autocomplete="current-password" required><button class="primary">Sign in</button><div id="loginStatus" class="status hidden"></div></form></div></div><script>const $=s=>document.querySelector(s);let imageData='';async function api(path,opt={}){const r=await fetch(path,{...opt,credentials:'include',headers:{'content-type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`Request failed (${r.status})`);return d}async function start(){try{const s=await api('/api/admin/session');if(s.authenticated)showEditor()}catch(err){const st=$('#loginStatus');if(st){st.textContent=err.message;st.className='status error'}}}function showEditor(){document.querySelector('#app').innerHTML=`<div class="top"><div class="brand">Sara Rain Crochet · Admin</div><button id="logout">Log out</button></div><div class="panel"><div class="muted">QUICK PUBLISH</div><h1 class="h">Publish a crochet tutorial</h1><p class="muted">Just upload the Pinterest pin and paste your finished HTML. Everything else is detected automatically.</p><form id="postForm"><div class="upload"><label>1 · Pinterest pin</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp" required><p class="hint">JPG, PNG, or WebP · maximum 4 MB</p><img id="preview" class="preview"></div><div style="margin-top:22px"><label>2 · Tutorial HTML</label><textarea id="html" required placeholder="Paste the complete HTML tutorial here..."></textarea><p class="hint">The page title, description, and URL slug are detected from your HTML. If it contains an image, its first image is automatically replaced with the uploaded pin.</p></div><div style="margin-top:22px"><button id="publishBtn" class="primary">Publish tutorial</button><div id="status" class="status hidden"></div></div></form></div>`;$('#logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST',body:'{}'});location.reload()};$('#image').onchange=()=>{const f=$('#image').files[0];if(!f)return;if(f.size>4*1024*1024){$('#status').textContent='Please keep the image under 4 MB.';$('#status').className='status error';$('#status').classList.remove('hidden');$('#image').value='';return}const r=new FileReader();r.onload=()=>{imageData=r.result;$('#preview').src=imageData;$('#preview').style.display='block'};r.readAsDataURL(f)};$('#postForm').onsubmit=async e=>{e.preventDefault();const status=$('#status'),btn=$('#publishBtn');status.textContent='Publishing…';status.className='status';status.classList.remove('hidden');btn.disabled=true;try{const d=await api('/api/admin/publish-html',{method:'POST',body:JSON.stringify({html:$('#html').value,imageDataUrl:imageData})});status.textContent='Published! '+d.url;status.className='status success';$('#postForm').reset();$('#preview').style.display='none';imageData=''}catch(err){status.textContent=err.message;status.className='status error'}finally{btn.disabled=false}}}$('#loginForm').onsubmit=async e=>{e.preventDefault();const st=$('#loginStatus');st.textContent='Signing in…';st.className='status';st.classList.remove('hidden');try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({identifier:$('#identifier').value,password:$('#password').value})});const s=await api('/api/admin/session');if(!s.authenticated)throw Error('Login succeeded but the admin session cookie was not accepted. Please try again.');location.href='/sara/?admin=1'}catch(err){st.textContent=err.message;st.className='status error'}};start();</script></body></html>
