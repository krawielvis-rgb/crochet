<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sara Rain Crochet — Admin</title><style>:root{--ink:#21312c;--cream:#f7f4ed;--paper:#fff;--rose:#9b5148;--line:#ddd4c8}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:30px 20px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font:600 25px Georgia,serif}.top button{background:none;border:1px solid var(--line);padding:10px 14px;border-radius:6px;cursor:pointer}.panel{background:var(--paper);border:1px solid var(--line);padding:28px;margin-bottom:20px}.login{max-width:500px;margin:8vh auto}.h{font:500 42px/1.05 Georgia,serif;margin:0 0 10px}.muted{color:#66716b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}input,textarea{width:100%;border:1px solid #cfc6bb;background:#fff;padding:12px;font:inherit;color:var(--ink);border-radius:5px}textarea{min-height:120px;resize:vertical}.full{grid-column:1/-1}.imagebox{border:1px dashed #b9afa4;padding:18px;text-align:center}.preview{display:none;width:100%;max-height:480px;object-fit:contain;margin-top:15px}.primary{background:var(--ink);color:white;border:0;padding:14px 20px;border-radius:5px;font-weight:700;cursor:pointer}.status{padding:12px;margin-top:15px;background:#f0ebe4}.hidden{display:none}.steps-help{font-size:12px;color:#66716b;margin-top:5px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div id="app" class="wrap"><div class="panel login"><div class="muted">SARA RAIN CROCHET · PRIVATE</div><h1 class="h">Admin login</h1><p class="muted">Sign in with the admin username or email and password.</p><form id="loginForm"><label>Username or email</label><input id="identifier" autocomplete="username" required><label style="margin-top:15px">Password</label><input id="password" type="password" autocomplete="current-password" required><button class="primary">Sign in</button><div id="loginStatus" class="status hidden"></div></form></div></div><script>const $=s=>document.querySelector(s);let imageData='';async function api(path,opt={}){const r=await fetch(path,{...opt,credentials:'include',headers:{'content-type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`Request failed (${r.status})`);return d}async function start(){try{const s=await api('/api/admin/session');if(s.authenticated)showEditor()}catch(err){const st=$('#loginStatus');if(st){st.textContent=err.message;st.classList.remove('hidden')}}}function showEditor(){document.querySelector('#app').innerHTML=`<div class="top"><div class="brand">Sara Rain Crochet · Admin</div><button id="logout">Log out</button></div><div class="panel"><div class="muted">PUBLISH A NEW TUTORIAL</div><h1 class="h">Create a crochet post</h1><p class="muted">Upload the Pinterest image, fill the long-form sections, and publish. The site creates the tutorial page and homepage card automatically.</p><form id="postForm" class="grid"><div><label>Title</label><input id="title" required placeholder="Crochet Baby Blanket"></div><div><label>Slug</label><input id="slug" placeholder="crochet-baby-blanket"><div class="steps-help">Leave blank to generate it from the title.</div></div><div><label>Category</label><input id="category" placeholder="Home & gifts"></div><div><label>Read time</label><input id="readTime" placeholder="12 min read"></div><div class="full"><label>SEO description</label><textarea id="description" required placeholder="A clear description for Google and Pinterest."></textarea></div><div class="full imagebox"><label>Pin image</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp" required><img id="preview" class="preview"></div><div class="full"><label>Materials & preparation</label><textarea id="materials" required placeholder="Yarn, hook, tools, measurements, gauge and preparation notes."></textarea></div><div class="full"><label>Introduction & core method</label><textarea id="intro" required placeholder="Explain the construction and what the maker should understand before starting."></textarea></div><div class="full"><label>Step-by-step instructions</label><textarea id="steps" required placeholder="One step per line.&#10;Start the foundation.&#10;Work the first row.&#10;Continue the repeat.&#10;Finish the edge."></textarea><div class="steps-help">Use one clear action per line.</div></div><div><label>Checkpoint</label><textarea id="checkpoint" required placeholder="What should the maker check for size, count or shape?"></textarea></div><div><label>Troubleshooting</label><textarea id="troubleshooting" required placeholder="Common mistakes and how to fix them."></textarea></div><div><label>Finishing</label><textarea id="finishing" required placeholder="Weaving ends, seams, edging, buttons, blocking, etc."></textarea></div><div><label>Variations & next projects</label><textarea id="variations" required placeholder="Colorways, sizing ideas and related projects."></textarea></div><div class="full"><label>Care & storage</label><textarea id="care" required placeholder="Washing, drying and storage instructions."></textarea></div><div class="full"><button class="primary">Publish tutorial</button><div id="status" class="status hidden"></div></div></form></div>`;$('#logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST',body:'{}'});location.reload()};$('#image').onchange=()=>{const f=$('#image').files[0];if(!f)return;if(f.size>4*1024*1024){$('#status').textContent='Please keep the image under 4 MB.';$('#status').classList.remove('hidden');$('#image').value='';return}const r=new FileReader();r.onload=()=>{imageData=r.result;$('#preview').src=imageData;$('#preview').style.display='block'};r.readAsDataURL(f)};$('#postForm').onsubmit=async e=>{e.preventDefault();const status=$('#status');status.textContent='Publishing…';status.classList.remove('hidden');try{const d=await api('/api/admin/publish',{method:'POST',body:JSON.stringify({title:$('#title').value,slug:$('#slug').value,category:$('#category').value,readTime:$('#readTime').value,description:$('#description').value,imageDataUrl:imageData,materials:$('#materials').value,intro:$('#intro').value,steps:$('#steps').value,checkpoint:$('#checkpoint').value,troubleshooting:$('#troubleshooting').value,finishing:$('#finishing').value,variations:$('#variations').value,care:$('#care').value})});status.textContent='Published! '+d.url+' — the homepage card is included automatically.';$('#postForm').reset();$('#preview').style.display='none';imageData=''}catch(err){status.textContent=err.message}}}$('#loginForm').onsubmit=async e=>{e.preventDefault();const st=$('#loginStatus');st.textContent='Signing in…';st.classList.remove('hidden');try{const result=await api('/api/admin/login',{method:'POST',body:JSON.stringify({identifier:$('#identifier').value,password:$('#password').value})});if(!result.authenticated){const s=await api('/api/admin/session');if(!s.authenticated)throw Error('Login succeeded but the admin session cookie was not accepted. Please try again.')}location.href='/sara/?admin=1'}catch(err){st.textContent=err.message}};start();</script></body></html>
