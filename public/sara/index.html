<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sara Rain Crochet — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #19302b;
      --cream: #f4f0e8;
      --paper: #fffdf9;
      --rose: #9b5148;
      --muted: #59655e;
      --line: rgba(25,48,43,.12);
      --soft: #eee8dc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: 'DM Sans', system-ui, sans-serif;
      line-height: 1.55;
    }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 36px 22px 90px; }
    .top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 36px; gap: 20px; flex-wrap: wrap;
    }
    .brand {
      font-family: Fraunces, Georgia, serif;
      font-size: 26px; font-weight: 600;
      display: flex; align-items: center; gap: 12px;
    }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--ink); color: var(--cream);
      display: grid; place-items: center;
      font: 600 14px 'DM Mono', monospace;
    }
    .btn {
      border: 1px solid var(--line); background: var(--paper);
      color: var(--ink); padding: 11px 16px; border-radius: 999px;
      font: 600 13px 'DM Sans', sans-serif; cursor: pointer;
      transition: .2s ease;
    }
    .btn:hover { background: var(--soft); }
    .btn-primary {
      background: var(--ink); color: var(--cream); border-color: var(--ink);
    }
    .btn-primary:hover { opacity: .92; background: var(--ink); }
    .btn-danger { color: var(--rose); border-color: rgba(155,81,72,.35); }
    .btn-danger:hover { background: #f8ebe8; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }

    .panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 32px;
      margin-bottom: 22px;
      box-shadow: 0 10px 30px rgba(25,48,43,.04);
    }
    .login { max-width: 480px; margin: 10vh auto; }
    .kicker {
      font: 700 11px/1 'DM Mono', monospace;
      letter-spacing: .14em; text-transform: uppercase; color: var(--rose);
      margin-bottom: 12px;
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 500; font-size: clamp(36px, 5vw, 52px);
      line-height: 1.05; margin: 0 0 12px;
    }
    h2 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 500; font-size: 28px; margin: 0 0 18px;
    }
    .muted { color: var(--muted); margin: 0 0 22px; }

    label {
      display: block; font: 700 11px/1 'DM Mono', monospace;
      letter-spacing: .1em; text-transform: uppercase;
      margin: 0 0 8px; color: var(--ink);
    }
    input, textarea, select {
      width: 100%; border: 1px solid var(--line);
      background: #fff; padding: 14px 16px;
      font: 15px/1.5 'DM Sans', sans-serif; color: var(--ink);
      border-radius: 14px; outline: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: rgba(25,48,43,.35);
      box-shadow: 0 0 0 3px rgba(25,48,43,.08);
    }
    textarea { min-height: 160px; resize: vertical; }
    textarea.tall { min-height: 280px; }
    .field { margin-bottom: 18px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } .panel { padding: 22px; } }

    .upload {
      border: 1.5px dashed rgba(25,48,43,.22);
      border-radius: 18px; padding: 28px; text-align: center;
      background: #fbf8f2;
    }
    .upload input { margin-top: 12px; }
    .preview {
      display: none; width: 100%; max-height: 360px;
      object-fit: contain; margin: 18px auto 0;
      border-radius: 14px; border: 1px solid var(--line);
    }

    .status {
      padding: 14px 16px; border-radius: 14px; margin-top: 16px;
      background: var(--soft); font-size: 14px;
    }
    .status.success { background: #e7f0e9; }
    .status.error { background: #f3e5e1; color: #7a3b34; }
    .hidden { display: none !important; }

    .tabs {
      display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap;
    }
    .tab {
      border: 1px solid var(--line); background: transparent;
      padding: 10px 16px; border-radius: 999px; cursor: pointer;
      font: 600 13px 'DM Sans', sans-serif; color: var(--muted);
    }
    .tab.active {
      background: var(--ink); color: var(--cream); border-color: var(--ink);
    }

    .post-list { display: grid; gap: 12px; }
    .post-item {
      display: grid; grid-template-columns: 72px 1fr auto;
      gap: 16px; align-items: center;
      padding: 14px; border: 1px solid var(--line);
      border-radius: 16px; background: #fff;
    }
    .post-item img {
      width: 72px; height: 96px; object-fit: cover; border-radius: 10px;
      background: var(--soft);
    }
    .post-item h3 {
      margin: 0 0 4px; font: 600 17px/1.25 Fraunces, Georgia, serif;
    }
    .post-item p { margin: 0; font-size: 13px; color: var(--muted); }
    .post-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; line-height: 1.55; }
    .section-note {
      background: #f1ebe3; border-left: 4px solid var(--rose);
      padding: 14px 16px; border-radius: 0 12px 12px 0;
      margin-bottom: 20px; font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="app" class="wrap">
    <div class="panel login">
      <div class="kicker">Sara Rain Crochet · Private</div>
      <h1>Admin login</h1>
      <p class="muted">Sign in with the admin username or email and password.</p>
      <form id="loginForm">
        <div class="field">
          <label>Username or email</label>
          <input id="identifier" autocomplete="username" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary" style="width:100%">Sign in</button>
        <div id="loginStatus" class="status hidden"></div>
      </form>
    </div>
  </div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
let imageData = '';
let postsCache = [];
let editingSlug = null;

async function api(path, opt = {}) {
  const r = await fetch(path, {
    ...opt,
    credentials: 'include',
    headers: { 'content-type': 'application/json', ...(opt.headers || {}) }
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Error(d.error || `Request failed (${r.status})`);
  return d;
}

function statusEl(id, text, type = '') {
  const el = $(id);
  el.textContent = text;
  el.className = 'status ' + type;
  el.classList.remove('hidden');
}

async function start() {
  try {
    const s = await api('/api/admin/session');
    if (s.authenticated) showDashboard();
  } catch (err) {
    const st = $('#loginStatus');
    if (st) { st.textContent = err.message; st.className = 'status error'; }
  }
}

function showDashboard() {
  document.querySelector('#app').innerHTML = `
    <div class="top">
      <div class="brand"><span class="brand-mark">S</span><span>Sara Rain · Admin</span></div>
      <button class="btn" id="logout">Log out</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="publish">Publish new</button>
      <button class="tab" data-tab="manage">Manage pins</button>
    </div>

    <div id="tab-publish">
      <div class="panel">
        <div class="kicker">Quick publish</div>
        <h1>New crochet tutorial</h1>
        <p class="muted">Upload the Pinterest pin image and paste the pattern content. The site template adds headers, structure, SEO, and footer automatically.</p>

        <div class="section-note">
          Tip: Paste content from ChatGPT as plain text. Use blank lines between sections. You can also fill the structured fields below for better results.
        </div>

        <form id="postForm">
          <div class="upload field">
            <label>1 · Pinterest pin image</label>
            <input id="image" type="file" accept="image/jpeg,image/png,image/webp" required>
            <p class="hint">JPG, PNG, or WebP · max ~4 MB</p>
            <img id="preview" class="preview" alt="Preview">
          </div>

          <div class="grid-2">
            <div class="field">
              <label>Title</label>
              <input id="title" required placeholder="e.g. Easy Crochet Market Bag">
            </div>
            <div class="field">
              <label>Category</label>
              <input id="category" placeholder="Crochet tutorial" value="Crochet tutorial">
            </div>
          </div>

          <div class="field">
            <label>Short description (SEO)</label>
            <textarea id="description" required placeholder="One or two sentences for search & social."></textarea>
          </div>

          <div class="field">
            <label>Materials</label>
            <textarea id="materials" placeholder="Yarn, hook size, notions…"></textarea>
          </div>

          <div class="field">
            <label>Intro / overview</label>
            <textarea id="intro" placeholder="A short introduction to the project."></textarea>
          </div>

          <div class="field">
            <label>Step-by-step (one step per line)</label>
            <textarea id="steps" class="tall" placeholder="Start with the foundation chain.\nWork the first row evenly.\nContinue until the desired size…"></textarea>
          </div>

          <div class="grid-2">
            <div class="field">
              <label>Checkpoint</label>
              <textarea id="checkpoint" placeholder="What to check before continuing…"></textarea>
            </div>
            <div class="field">
              <label>Troubleshooting</label>
              <textarea id="troubleshooting" placeholder="Common problems and fixes…"></textarea>
            </div>
          </div>

          <div class="grid-2">
            <div class="field">
              <label>Finishing</label>
              <textarea id="finishing" placeholder="Weave ends, block, attach hardware…"></textarea>
            </div>
            <div class="field">
              <label>Variations</label>
              <textarea id="variations" placeholder="Color ideas, size changes…"></textarea>
            </div>
          </div>

          <div class="field">
            <label>Care & storage</label>
            <textarea id="care" placeholder="Washing and storage notes…"></textarea>
          </div>

          <div class="field">
            <label>Or paste full pattern content (optional helper)</label>
            <textarea id="rawContent" class="tall" placeholder="Paste a big block of text from ChatGPT. We will try to map it into the fields above if they are empty."></textarea>
            <p class="hint">If the structured fields are empty, the publisher will use this text as the main body.</p>
          </div>

          <button id="publishBtn" class="btn btn-primary">Publish tutorial</button>
          <div id="status" class="status hidden"></div>
        </form>
      </div>
    </div>

    <div id="tab-manage" class="hidden">
      <div class="panel">
        <div class="kicker">Library</div>
        <h2>Published pins</h2>
        <p class="muted">Edit details or remove a tutorial from the catalog.</p>
        <div id="postList" class="post-list">Loading…</div>
        <div id="manageStatus" class="status hidden"></div>
      </div>
    </div>
  `;

  $('#logout').onclick = async () => {
    await api('/api/admin/logout', { method: 'POST', body: '{}' });
    location.reload();
  };

  $$('.tab').forEach(t => t.onclick = () => {
    $$('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    $('#tab-publish').classList.toggle('hidden', t.dataset.tab !== 'publish');
    $('#tab-manage').classList.toggle('hidden', t.dataset.tab !== 'manage');
    if (t.dataset.tab === 'manage') loadPosts();
  });

  $('#image').onchange = () => {
    const f = $('#image').files[0];
    if (!f) return;
    if (f.size > 4 * 1024 * 1024) {
      statusEl('#status', 'Please keep the image under 4 MB.', 'error');
      $('#image').value = '';
      return;
    }
    const r = new FileReader();
    r.onload = () => {
      imageData = r.result;
      $('#preview').src = imageData;
      $('#preview').style.display = 'block';
    };
    r.readAsDataURL(f);
  };

  $('#postForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = $('#publishBtn');
    statusEl('#status', 'Publishing…');
    btn.disabled = true;
    try {
      const payload = {
        title: $('#title').value.trim(),
        description: $('#description').value.trim(),
        category: $('#category').value.trim() || 'Crochet tutorial',
        materials: $('#materials').value.trim(),
        intro: $('#intro').value.trim(),
        steps: $('#steps').value.trim(),
        checkpoint: $('#checkpoint').value.trim(),
        troubleshooting: $('#troubleshooting').value.trim(),
        finishing: $('#finishing').value.trim(),
        variations: $('#variations').value.trim(),
        care: $('#care').value.trim(),
        rawContent: $('#rawContent').value.trim(),
        imageDataUrl: imageData,
        slug: editingSlug || undefined
      };
      const d = await api('/api/admin/publish', { method: 'POST', body: JSON.stringify(payload) });
      statusEl('#status', 'Published! ' + d.url, 'success');
      $('#postForm').reset();
      $('#preview').style.display = 'none';
      imageData = '';
      editingSlug = null;
      btn.textContent = 'Publish tutorial';
    } catch (err) {
      statusEl('#status', err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  };
}

async function loadPosts() {
  const list = $('#postList');
  list.innerHTML = 'Loading…';
  try {
    postsCache = await api('/api/posts');
    if (!postsCache.length) {
      list.innerHTML = '<p class="muted">No published tutorials yet.</p>';
      return;
    }
    list.innerHTML = postsCache.map(p => `
      <div class="post-item" data-slug="${p.slug}">
        <img src="${p.image || ''}" alt="" onerror="this.style.background='#eee8dc'">
        <div>
          <h3>${escapeHtml(p.title || p.slug)}</h3>
          <p>${escapeHtml(p.category || 'Tutorial')} · /posts/${escapeHtml(p.slug)}.html</p>
        </div>
        <div class="post-actions">
          <button class="btn" data-edit="${p.slug}">Edit</button>
          <button class="btn btn-danger" data-delete="${p.slug}">Delete</button>
        </div>
      </div>
    `).join('');

    list.querySelectorAll('[data-edit]').forEach(btn => {
      btn.onclick = () => editPost(btn.dataset.edit);
    });
    list.querySelectorAll('[data-delete]').forEach(btn => {
      btn.onclick = () => deletePost(btn.dataset.delete);
    });
  } catch (err) {
    list.innerHTML = `<p class="status error">${escapeHtml(err.message)}</p>`;
  }
}

function editPost(slug) {
  const p = postsCache.find(x => x.slug === slug);
  if (!p) return;
  editingSlug = slug;
  $$('.tab').forEach(x => x.classList.toggle('active', x.dataset.tab === 'publish'));
  $('#tab-publish').classList.remove('hidden');
  $('#tab-manage').classList.add('hidden');
  $('#title').value = p.title || '';
  $('#description').value = p.description || '';
  $('#category').value = p.category || 'Crochet tutorial';
  $('#materials').value = p.materials || '';
  $('#intro').value = p.intro || '';
  $('#steps').value = Array.isArray(p.steps) ? p.steps.join('\n') : (p.steps || '');
  $('#checkpoint').value = p.checkpoint || '';
  $('#troubleshooting').value = p.troubleshooting || '';
  $('#finishing').value = p.finishing || '';
  $('#variations').value = p.variations || '';
  $('#care').value = p.care || '';
  $('#publishBtn').textContent = 'Update tutorial';
  statusEl('#status', 'Editing “' + (p.title || slug) + '”. Upload a new image only if you want to replace the pin.', '');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function deletePost(slug) {
  if (!confirm('Delete “' + slug + '” from the catalog? The HTML file may remain until cleaned up.')) return;
  try {
    statusEl('#manageStatus', 'Deleting…');
    await api('/api/admin/delete', { method: 'POST', body: JSON.stringify({ slug }) });
    statusEl('#manageStatus', 'Deleted “' + slug + '”.', 'success');
    loadPosts();
  } catch (err) {
    statusEl('#manageStatus', err.message, 'error');
  }
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');
}

$('#loginForm').onsubmit = async e => {
  e.preventDefault();
  statusEl('#loginStatus', 'Signing in…');
  try {
    await api('/api/admin/login', {
      method: 'POST',
      body: JSON.stringify({
        identifier: $('#identifier').value,
        password: $('#password').value
      })
    });
    const s = await api('/api/admin/session');
    if (!s.authenticated) throw Error('Login succeeded but session cookie was not accepted.');
    showDashboard();
  } catch (err) {
    statusEl('#loginStatus', err.message, 'error');
  }
};

start();
</script>
</body>
</html>
