<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sara Rain Crochet — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #19302b;
      --cream: #f4f0e8;
      --paper: #fffdf9;
      --rose: #9b5148;
      --muted: #59655e;
      --line: rgba(25,48,43,.12);
      --soft: #eee8dc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: 'DM Sans', system-ui, sans-serif;
      line-height: 1.55;
    }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 36px 22px 90px; }
    .top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 36px; gap: 20px; flex-wrap: wrap;
    }
    .brand {
      font-family: Fraunces, Georgia, serif;
      font-size: 26px; font-weight: 600;
      display: flex; align-items: center; gap: 12px;
    }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--ink); color: var(--cream);
      display: grid; place-items: center;
      font: 600 14px 'DM Mono', monospace;
    }
    .btn {
      border: 1px solid var(--line); background: var(--paper);
      color: var(--ink); padding: 11px 16px; border-radius: 999px;
      font: 600 13px 'DM Sans', sans-serif; cursor: pointer;
      transition: .2s ease; text-decoration: none; display: inline-block;
    }
    .btn:hover { background: var(--soft); }
    .btn-primary {
      background: var(--ink); color: var(--cream); border-color: var(--ink);
    }
    .btn-primary:hover { opacity: .92; background: var(--ink); }
    .btn-danger { color: var(--rose); border-color: rgba(155,81,72,.35); }
    .btn-danger:hover { background: #f8ebe8; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }

    .panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 32px;
      margin-bottom: 22px;
      box-shadow: 0 10px 30px rgba(25,48,43,.04);
    }
    .login { max-width: 480px; margin: 10vh auto; }
    .kicker {
      font: 700 11px/1 'DM Mono', monospace;
      letter-spacing: .14em; text-transform: uppercase; color: var(--rose);
      margin-bottom: 12px;
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 500; font-size: clamp(36px, 5vw, 52px);
      line-height: 1.05; margin: 0 0 12px;
    }
    h2 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 500; font-size: 28px; margin: 0 0 18px;
    }
    .muted { color: var(--muted); margin: 0 0 22px; }

    label {
      display: block; font: 700 11px/1 'DM Mono', monospace;
      letter-spacing: .1em; text-transform: uppercase;
      margin: 0 0 8px; color: var(--ink);
    }
    input, textarea {
      width: 100%; border: 1px solid var(--line);
      background: #fff; padding: 14px 16px;
      font: 15px/1.5 'DM Sans', sans-serif; color: var(--ink);
      border-radius: 14px; outline: none;
    }
    input:focus, textarea:focus {
      border-color: rgba(25,48,43,.35);
      box-shadow: 0 0 0 3px rgba(25,48,43,.08);
    }
    textarea {
      min-height: 480px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      line-height: 1.55;
    }
    .field { margin-bottom: 18px; }

    .upload {
      border: 1.5px dashed rgba(25,48,43,.22);
      border-radius: 18px; padding: 28px; text-align: center;
      background: #fbf8f2;
    }
    .upload input { margin-top: 12px; }
    .preview {
      display: none; width: 100%; max-height: 360px;
      object-fit: contain; margin: 18px auto 0;
      border-radius: 14px; border: 1px solid var(--line);
    }

    .status {
      padding: 14px 16px; border-radius: 14px; margin-top: 16px;
      background: var(--soft); font-size: 14px;
    }
    .status.success { background: #e7f0e9; }
    .status.error { background: #f3e5e1; color: #7a3b34; }
    .hidden { display: none !important; }

    .tabs {
      display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap;
    }
    .tab {
      border: 1px solid var(--line); background: transparent;
      padding: 10px 16px; border-radius: 999px; cursor: pointer;
      font: 600 13px 'DM Sans', sans-serif; color: var(--muted);
    }
    .tab.active {
      background: var(--ink); color: var(--cream); border-color: var(--ink);
    }

    .post-list { display: grid; gap: 12px; }
    .post-item {
      display: grid; grid-template-columns: 72px 1fr auto;
      gap: 16px; align-items: center;
      padding: 14px; border: 1px solid var(--line);
      border-radius: 16px; background: #fff;
    }
    .post-item .thumb {
      width: 72px; height: 96px; border-radius: 10px;
      background: var(--soft);
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }
    .post-item h3 {
      margin: 0 0 4px; font: 600 17px/1.25 Fraunces, Georgia, serif;
    }
    .post-item p { margin: 0; font-size: 13px; color: var(--muted); word-break: break-all; }
    .post-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; line-height: 1.55; }
  </style>
</head>
<body>
  <div id="app" class="wrap"></div>

<script>
const $ = (s, root) => (root || document).querySelector(s);
const $$ = (s, root) => Array.prototype.slice.call((root || document).querySelectorAll(s));

var imageData = '';
var postsCache = [];
var editingSlug = null;

async function api(path, opt) {
  opt = opt || {};
  var r = await fetch(path, {
    method: opt.method || 'GET',
    credentials: 'include',
    headers: Object.assign({ 'content-type': 'application/json' }, opt.headers || {}),
    body: opt.body
  });
  var d = await r.json().catch(function () { return {}; });
  if (!r.ok) throw Error(d.error || ('Request failed (' + r.status + ')'));
  return d;
}

function statusEl(id, text, type) {
  var el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.className = 'status' + (type ? (' ' + type) : '');
  el.classList.remove('hidden');
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&')
    .replace(/</g, '<')
    .replace(/>/g, '>')
    .replace(/"/g, '"');
}

function pinUrl(p) {
  if (p && p.image && (String(p.image).indexOf('http') === 0 || String(p.image).charAt(0) === '/')) {
    return p.image;
  }
  if (p && p.slug) return '/images/pins/pin-' + p.slug + '.jpg';
  return '';
}

function switchTab(name) {
  $$('.tab').forEach(function (x) {
    x.classList.toggle('active', x.getAttribute('data-tab') === name);
  });
  var publish = document.getElementById('tab-publish');
  var manage = document.getElementById('tab-manage');
  if (publish) publish.classList.toggle('hidden', name !== 'publish');
  if (manage) manage.classList.toggle('hidden', name !== 'manage');
  if (name === 'manage') loadPosts();
}

function showLogin() {
  document.getElementById('app').innerHTML =
    '<div class="panel login">' +
      '<div class="kicker">Sara Rain Crochet · Private</div>' +
      '<h1>Admin login</h1>' +
      '<p class="muted">Sign in with the admin username or email and password.</p>' +
      '<form id="loginForm">' +
        '<div class="field"><label>Username or email</label>' +
        '<input id="identifier" autocomplete="username" required></div>' +
        '<div class="field"><label>Password</label>' +
        '<input id="password" type="password" autocomplete="current-password" required></div>' +
        '<button class="btn btn-primary" style="width:100%">Sign in</button>' +
        '<div id="loginStatus" class="status hidden"></div>' +
      '</form></div>';

  document.getElementById('loginForm').onsubmit = async function (e) {
    e.preventDefault();
    statusEl('loginStatus', 'Signing in…');
    try {
      await api('/api/admin/login', {
        method: 'POST',
        body: JSON.stringify({
          identifier: document.getElementById('identifier').value,
          password: document.getElementById('password').value
        })
      });
      var s = await api('/api/admin/session');
      if (!s.authenticated) throw Error('Login succeeded but session cookie was not accepted.');
      showDashboard();
    } catch (err) {
      statusEl('loginStatus', err.message, 'error');
    }
  };
}

function showDashboard() {
  document.getElementById('app').innerHTML =
    '<div class="top">' +
      '<div class="brand"><span class="brand-mark">S</span><span>Sara Rain · Admin</span></div>' +
      '<button class="btn" id="logout">Log out</button>' +
    '</div>' +
    '<div class="tabs">' +
      '<button type="button" class="tab active" data-tab="publish">Publish</button>' +
      '<button type="button" class="tab" data-tab="manage">Manage pins</button>' +
    '</div>' +
    '<div id="tab-publish">' +
      '<div class="panel">' +
        '<div class="kicker">Quick publish / edit</div>' +
        '<h1 id="publishHeading">Publish a tutorial</h1>' +
        '<p class="muted">Upload a pin image (required for new posts) and paste or edit the full HTML. Click Edit on Manage to load existing HTML here.</p>' +
        '<form id="postForm">' +
          '<div class="upload field">' +
            '<label>1 · Pinterest pin</label>' +
            '<input id="image" type="file" accept="image/jpeg,image/png,image/webp">' +
            '<p class="hint">JPG, PNG, or WebP · max ~4 MB. Optional when updating an existing post if you keep the same pin.</p>' +
            '<img id="preview" class="preview" alt="Preview">' +
          '</div>' +
          '<div class="field">' +
            '<label>2 · Tutorial HTML</label>' +
            '<textarea id="html" required placeholder="Paste the complete HTML tutorial here..."></textarea>' +
            '<p class="hint">Needs a title tag or h1. On publish, the first image can be replaced with your uploaded pin.</p>' +
          '</div>' +
          '<button id="publishBtn" class="btn btn-primary" type="submit">Publish tutorial</button>' +
          '<button id="cancelEditBtn" class="btn hidden" type="button" style="margin-left:8px">Cancel edit</button>' +
          '<div id="status" class="status hidden"></div>' +
        '</form>' +
      '</div>' +
    '</div>' +
    '<div id="tab-manage" class="hidden">' +
      '<div class="panel">' +
        '<div class="kicker">Library</div>' +
        '<h2>Published pins</h2>' +
        '<p class="muted">Edit loads the post HTML into the editor. Delete removes it from the homepage catalog.</p>' +
        '<div id="postList" class="post-list">Loading…</div>' +
        '<div id="manageStatus" class="status hidden"></div>' +
      '</div>' +
    '</div>';

  document.getElementById('logout').onclick = async function () {
    await api('/api/admin/logout', { method: 'POST', body: '{}' });
    location.reload();
  };

  $$('.tab').forEach(function (t) {
    t.onclick = function () { switchTab(t.getAttribute('data-tab')); };
  });

  document.getElementById('cancelEditBtn').onclick = function () {
    editingSlug = null;
    document.getElementById('html').value = '';
    document.getElementById('image').value = '';
    imageData = '';
    var prev = document.getElementById('preview');
    if (prev) prev.style.display = 'none';
    document.getElementById('publishBtn').textContent = 'Publish tutorial';
    document.getElementById('publishHeading').textContent = 'Publish a tutorial';
    document.getElementById('cancelEditBtn').classList.add('hidden');
    statusEl('status', 'Edit cancelled.');
  };

  var imageInput = document.getElementById('image');
  imageInput.onchange = function () {
    var f = imageInput.files && imageInput.files[0];
    if (!f) return;
    if (f.size > 4 * 1024 * 1024) {
      statusEl('status', 'Please keep the image under 4 MB.', 'error');
      imageInput.value = '';
      return;
    }
    var r = new FileReader();
    r.onload = function () {
      imageData = r.result;
      var prev = document.getElementById('preview');
      if (prev) {
        prev.src = imageData;
        prev.style.display = 'block';
      }
    };
    r.readAsDataURL(f);
  };

  document.getElementById('postForm').onsubmit = async function (e) {
    e.preventDefault();
    var btn = document.getElementById('publishBtn');
    statusEl('status', editingSlug ? 'Updating…' : 'Publishing…');
    btn.disabled = true;
    try {
      var html = document.getElementById('html').value;
      var payload = { html: html, imageDataUrl: imageData || '' };
      if (editingSlug) payload.slug = editingSlug;
      var d = await api('/api/admin/publish-html', {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      statusEl('status', (editingSlug ? 'Updated! ' : 'Published! ') + d.url, 'success');
      document.getElementById('postForm').reset();
      var prev = document.getElementById('preview');
      if (prev) prev.style.display = 'none';
      imageData = '';
      editingSlug = null;
      btn.textContent = 'Publish tutorial';
      document.getElementById('publishHeading').textContent = 'Publish a tutorial';
      document.getElementById('cancelEditBtn').classList.add('hidden');
    } catch (err) {
      statusEl('status', err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  };
}

async function editPost(slug) {
  switchTab('publish');
  editingSlug = slug;
  document.getElementById('publishHeading').textContent = 'Edit tutorial';
  document.getElementById('publishBtn').textContent = 'Save changes';
  document.getElementById('cancelEditBtn').classList.remove('hidden');
  document.getElementById('html').value = '';
  statusEl('status', 'Loading HTML for “' + slug + '”…');
  try {
    var d = await api('/api/admin/post-html?slug=' + encodeURIComponent(slug));
    document.getElementById('html').value = d.html || '';
    statusEl('status', 'Loaded HTML for “' + (d.title || slug) + '”. Edit the code below, optionally upload a new pin, then Save changes.');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (err) {
    statusEl('status', err.message, 'error');
  }
}

async function loadPosts() {
  var list = document.getElementById('postList');
  if (!list) return;
  list.innerHTML = 'Loading…';
  try {
    postsCache = await api('/api/posts');
    if (!Array.isArray(postsCache) || !postsCache.length) {
      list.innerHTML = '<p class="muted">No published tutorials in the catalog yet.</p>';
      return;
    }
    list.innerHTML = postsCache.map(function (p) {
      var img = pinUrl(p);
      var bg = img ? ('style="background-image:url(\'' + String(img).replace(/\'/g, '%27') + '\')"') : '';
      var slug = escapeHtml(p.slug || '');
      var title = escapeHtml(p.title || p.slug || 'Untitled');
      var cat = escapeHtml(p.category || 'Tutorial');
      return (
        '<div class="post-item" data-slug="' + slug + '">' +
          '<div class="thumb" ' + bg + '></div>' +
          '<div>' +
            '<h3>' + title + '</h3>' +
            '<p>' + cat + ' · /posts/' + slug + '.html</p>' +
          '</div>' +
          '<div class="post-actions">' +
            '<a class="btn" href="/posts/' + slug + '.html" target="_blank" rel="noopener">View</a>' +
            '<button type="button" class="btn" data-edit="' + slug + '">Edit</button>' +
            '<button type="button" class="btn btn-danger" data-delete="' + slug + '">Delete</button>' +
          '</div>' +
        '</div>'
      );
    }).join('');

    list.querySelectorAll('[data-delete]').forEach(function (btn) {
      btn.onclick = function () { deletePost(btn.getAttribute('data-delete')); };
    });
    list.querySelectorAll('[data-edit]').forEach(function (btn) {
      btn.onclick = function () { editPost(btn.getAttribute('data-edit')); };
    });
  } catch (err) {
    list.innerHTML = '<p class="status error">' + escapeHtml(err.message) + '</p>';
  }
}

async function deletePost(slug) {
  if (!slug) return;
  if (!confirm('Remove “' + slug + '” from the catalog?')) return;
  try {
    statusEl('manageStatus', 'Deleting…');
    await api('/api/admin/delete', { method: 'POST', body: JSON.stringify({ slug: slug }) });
    statusEl('manageStatus', 'Deleted “' + slug + '”.', 'success');
    loadPosts();
  } catch (err) {
    statusEl('manageStatus', err.message, 'error');
  }
}

async function start() {
  try {
    var s = await api('/api/admin/session');
    if (s.authenticated) showDashboard();
    else showLogin();
  } catch (e) {
    showLogin();
  }
}

start();
</script>
</body>
</html>
