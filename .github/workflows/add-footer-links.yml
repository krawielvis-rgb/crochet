name: Add footer links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add legal and navigation footer links
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<footer id="stories" class="site-footer"><div><strong>Sara Rain Crochet</strong><p>Make something lovely, slowly.</p></div><p>Patterns · Tutorials · Inspiration</p></footer>'
          new = '''<footer id="stories" class="site-footer">
            <div class="site-footer-brand">
              <strong>Sara Rain Crochet</strong>
              <p>Make something lovely, slowly.</p>
            </div>
            <div class="site-footer-links">
              <div>
                <strong>Explore</strong>
                <a href="#learn">Learn</a>
                <a href="#patterns">Patterns</a>
                <a href="#pinterest-tutorials">Pinterest</a>
              </div>
              <div>
                <strong>Information</strong>
                <a href="/about.html">About</a>
                <a href="/contact.html">Contact</a>
                <a href="/privacy-policy.html">Privacy Policy</a>
                <a href="/terms.html">Terms</a>
              </div>
            </div>
          </footer>'''
          if old not in s:
              raise SystemExit('Expected footer was not found; stopping without changes.')
          s = s.replace(old, new, 1)
          css = '''\n  <style>\n    .site-footer{display:flex;justify-content:space-between;gap:48px;align-items:flex-start;padding:64px max(24px,calc((100% - 1180px)/2)) 70px;background:#19302b;color:#f4f0e8}.site-footer-brand strong,.site-footer-links strong{display:block;font-family:Fraunces,serif;font-size:22px;margin-bottom:10px}.site-footer-brand p{margin:0;color:rgba(244,240,232,.72)}.site-footer-links{display:flex;gap:70px}.site-footer-links div{display:flex;flex-direction:column;gap:9px}.site-footer-links div strong{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#d8b9a9;margin-bottom:4px}.site-footer-links a{color:rgba(244,240,232,.78);text-decoration:none;font-size:14px}.site-footer-links a:hover{color:#fff;text-decoration:underline}@media(max-width:650px){.site-footer{display:block}.site-footer-links{margin-top:35px;gap:45px;flex-wrap:wrap}}\n  </style>\n'''
          marker = '</head>'
          if '.site-footer-links' not in s:
              s = s.replace(marker, css + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-footer-links.yml
          git commit -m "Add visible footer navigation and legal links"
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/add-footer-links.yml
          git commit -m "Remove one-time footer workflow"
          git push
