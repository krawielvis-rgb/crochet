name: Remove baby blanket homepage cards
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  remove-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove both cards from index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          targets = [
              'easy-crochet-baby-blanket-pattern-for-beginners-sara-rain-crochet.html',
              'crochet-baby-blanket.html'
          ]
          import re
          for target in targets:
              pattern = r'\s*<a class="pinterest-card" href="/posts/' + re.escape(target) + r'">.*?</a>'
              s, n = re.subn(pattern, '', s, count=1, flags=re.S)
              print(target, 'removed:', n)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Remove baby blanket cards from homepage directly'
          git push
      - name: Delete this workflow
        if: always()
        run: |
          git rm .github/workflows/remove-baby-blanket-cards-now.yml || true
          git diff --cached --quiet || git commit -m 'Remove temporary cleanup workflow'
          git push || true
