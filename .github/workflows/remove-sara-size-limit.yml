name: Remove Sara HTML size limit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-limit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove 900 KB publishing limit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/worker-v2.js')
          s = p.read_text()
          old = "if(html.length>900000)return out({error:'HTML is too large. Keep the pasted page under 900 KB.'},400);"
          if old not in s:
              raise SystemExit('Target 900 KB limit was not found; refusing to change anything.')
          s = s.replace(old, '')
          p.write_text(s)
          PY
      - name: Commit the fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/worker-v2.js
          git commit -m "Remove 900 KB Sara publishing limit"
          git push
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/remove-sara-size-limit.yml
          git add -u .github/workflows/remove-sara-size-limit.yml
          git commit -m "Remove temporary size-limit workflow"
          git push
