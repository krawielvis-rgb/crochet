name: Rename baby booties tutorial

on:
  push:
    paths:
      - '.github/workflows/rename-baby-booties.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rename title
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('public/posts/easy-crochet-baby-booties-pattern-for-beginners-sara-rain-crochet.html')
          text = page.read_text(encoding='utf-8')
          replacements = {
              '<title>Easy Crochet Baby Booties Pattern for Beginners | Sara Rain Crochet</title>': '<title>Easy Crochet Baby Booties</title>',
              '<meta property="og:title" content="Easy Crochet Baby Booties Pattern for Beginners">': '<meta property="og:title" content="Easy Crochet Baby Booties">',
              '<meta name="twitter:title" content="Easy Crochet Baby Booties Pattern for Beginners">': '<meta name="twitter:title" content="Easy Crochet Baby Booties">',
              '<h1>Easy Crochet Baby Booties Pattern for Beginners</h1>': '<h1>Easy Crochet Baby Booties</h1>',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          page.write_text(text, encoding='utf-8')

          data = Path('data/posts.json')
          text = data.read_text(encoding='utf-8')
          text = text.replace(
              '"title": "Easy Crochet Baby Booties Pattern for Beginners | Sara Rain Crochet"',
              '"title": "Easy Crochet Baby Booties"',
              1,
          )
          data.write_text(text, encoding='utf-8')
          PY

      - name: Commit and remove workflow
        run: |
          rm .github/workflows/rename-baby-booties.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/posts/easy-crochet-baby-booties-pattern-for-beginners-sara-rain-crochet.html data/posts.json .github/workflows/rename-baby-booties.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Rename baby booties tutorial'
          git push
