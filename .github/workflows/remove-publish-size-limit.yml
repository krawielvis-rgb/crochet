name: Remove publish size limit
on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove 900 KB guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/worker-v2.js')
          s = p.read_text()
          old = "if(html.length>900000)\n    return out({error:'HTML is too large. Keep the pasted page under 900 KB.'},400);\n"
          if old not in s:
              raise SystemExit('Target limit not found')
          p.write_text(s.replace(old, '', 1))
          Path('.github/workflows/remove-publish-size-limit.yml').unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/worker-v2.js .github/workflows/remove-publish-size-limit.yml
          git commit -m 'Remove 900 KB publish size limit'
          git push
