name: Fix four tutorial headers

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-four-tutorial-headers.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make tutorial brands link home
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('public/posts/easy-crochet-baby-blanket-pattern-for-beginners-sara-rain-crochet.html'),
              Path('public/posts/easy-crochet-baby-booties-pattern-for-beginners-sara-rain-crochet.html'),
              Path('public/posts/crochet-beanie-for-beginners-sara-rain-crochet.html'),
              Path('public/posts/crochet-bookmark-tutorial-sara-rain-crochet.html'),
          ]

          # Baby blanket: make the existing brand block a styled home link.
          p = files[0]
          s = p.read_text()
          s = s.replace(
              '    .brand {\n      font-size: 1.15rem;',
              '    .brand {\n      color: #21312c;\n      text-decoration: none;\n      font-size: 1.15rem;',
              1,
          )
          s = s.replace(
              '  <div class="brand">\n    <span class="brand-mark">S</span>\n    Sara Rain Crochet\n  </div>',
              '  <a href="/" class="brand">\n    <span class="brand-mark">S</span>\n    Sara Rain Crochet\n  </a>',
              1,
          )
          p.write_text(s)

          # Baby booties: make the brand a home link while preserving the page palette.
          p = files[1]
          s = p.read_text()
          s = s.replace(
              '    .brand {\n      font-weight: 700;',
              '    .brand {\n      color: var(--ink);\n      text-decoration: none;\n      font-weight: 700;',
              1,
          )
          s = s.replace(
              '    <div class="brand">Sara Rain Crochet</div>',
              '    <a href="/" class="brand">Sara Rain Crochet</a>',
              1,
          )
          p.write_text(s)

          # Beanie already has the correct clickable brand; keep it unchanged.

          # Bookmark: make the rose-colored brand a home link without changing its look.
          p = files[3]
          s = p.read_text()
          s = s.replace(
              '    .brand {\n      font-family: Arial, sans-serif;',
              '    .brand {\n      display: inline-block;\n      color: var(--rose-dark);\n      text-decoration: none;\n      font-family: Arial, sans-serif;',
              1,
          )
          s = s.replace(
              '    <div class="brand">Sara Rain Crochet</div>',
              '    <a href="/" class="brand">Sara Rain Crochet</a>',
              1,
          )
          p.write_text(s)

          for p in files:
              if not p.exists():
                  raise SystemExit(f'Missing expected file: {p}')
          print('Updated four tutorial headers.')
          PY

      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-four-tutorial-headers.yml
          git add public/posts/easy-crochet-baby-blanket-pattern-for-beginners-sara-rain-crochet.html \
                  public/posts/easy-crochet-baby-booties-pattern-for-beginners-sara-rain-crochet.html \
                  public/posts/crochet-beanie-for-beginners-sara-rain-crochet.html \
                  public/posts/crochet-bookmark-tutorial-sara-rain-crochet.html
          git commit -m "Make tutorial headers link to homepage"
          git push
