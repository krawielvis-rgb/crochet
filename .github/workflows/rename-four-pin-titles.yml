name: Rename four Pinterest tutorial titles

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rename-four-pin-titles.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update titles
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'public/posts/easy-crochet-baby-blanket-pattern-for-beginners-sara-rain-crochet.html': (
                  '<title>Easy Crochet Baby Blanket Pattern for Beginners | Sara Rain Crochet</title>',
                  '<title>Easy Crochet Baby Blanket</title>'
              ),
              'public/posts/crochet-beanie-for-beginners-sara-rain-crochet.html': (
                  '<title>Crochet Beanie for Beginners | Sara Rain Crochet</title>',
                  '<title>Crochet Beanie for Beginners</title>'
              ),
              'public/posts/crochet-bookmark-tutorial-sara-rain-crochet.html': (
                  '<title>Crochet Bookmark Tutorial | Sara Rain Crochet</title>',
                  '<title>Crochet Bookmark Tutorial</title>'
              ),
          }

          changed = []
          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text()
              if old in text:
                  path.write_text(text.replace(old, new, 1))
                  changed.append(filename)
              else:
                  print(f'Already updated or old title not found: {filename}')

          print(f'Updated {len(changed)} title(s).')
          PY

      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/posts/*.html .github/workflows/rename-four-pin-titles.yml
          git rm .github/workflows/rename-four-pin-titles.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Clean up Pinterest tutorial titles"
          git push
