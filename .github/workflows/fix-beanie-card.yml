name: Fix crochet beanie card title

on:
  push:
    paths:
      - '.github/workflows/fix-beanie-card.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update beanie title everywhere
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = [
              ('Easy Crochet Baby Booties Pattern for Beginners | Sara Rain Crochet', 'Easy Crochet Baby Booties'),
              ('Crochet Beanie for Beginners | Sara Rain Crochet', 'Crochet Beanie'),
          ]

          for filename in ['data/posts.json', 'index.html']:
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/fix-beanie-card.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/posts.json index.html .github/workflows/fix-beanie-card.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Shorten crochet beanie homepage card title'
          git push
