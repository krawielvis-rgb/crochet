name: Cleanup homepage cards
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove unwanted homepage cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          targets = [
              'crochet-sunglasses-case',
              'crochet-mug-cozy-tutorial',
              'crochet-baby-blanket.html',
          ]
          for target in targets:
              pattern = r'\s*<a class="pinterest-card" href="[^"]*' + re.escape(target) + r'[^"]*">.*?</a>'
              s, n = re.subn(pattern, '', s, flags=re.S)
              print(target, 'removed', n)
          p.write_text(s)
          PY
          git add index.html
          git diff --cached --quiet || git commit -m "Remove unwanted duplicate homepage cards"
          git push
      - name: Remove this temporary workflow
        run: |
          rm -f .github/workflows/cleanup-homepage.yml
          git add .github/workflows/cleanup-homepage.yml
          git commit -m "Remove temporary homepage cleanup workflow" || true
          git push
