name: Finalize tutorial header style

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-tutorial-header-style.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply header structure and future publisher rule
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          skip = {'easy-crochet-baby-blanket-pattern-for-beginners-sara-rain-crochet.html'}
          style = '''<style id="sara-rain-header-style-v2">
          .tutorial-hero,.article-hero{background:#eee8dc!important;padding:42px!important;border-radius:24px!important;margin:20px 0 34px!important;text-align:left!important}
          .tutorial-hero .eyebrow,.article-hero .meta{display:block!important;color:#6a8278!important;font:700 .75rem Arial,sans-serif!important;text-transform:uppercase!important;letter-spacing:.12em!important;margin:0 0 14px!important}
          .tutorial-hero h1,.article-hero h1{font-size:clamp(2.5rem,6vw,4.5rem)!important;line-height:1.03!important;margin:14px 0 20px!important;font-weight:500!important;letter-spacing:-.03em!important}
          .tutorial-hero .lede,.article-hero .dek{font-size:1.2rem!important;line-height:1.55!important;max-width:760px!important;color:#53655f!important;margin:0!important}
          .tutorial-hero .hero-image,.article-hero img{width:100%!important;max-height:720px!important;object-fit:cover!important;border-radius:18px!important;margin:28px 0 0!important;display:block!important}
          @media(max-width:700px){.tutorial-hero,.article-hero{padding:28px 22px!important}.tutorial-hero h1,.article-hero h1{font-size:2.7rem!important}}
          </style>'''

          def clean(x):
              return re.sub(r'<[^>]+>', ' ', x or '')

          def normalize(s):
              if 'sara-rain-header-style-v2' not in s:
                  s=s.replace('</head>',style+'\n</head>',1)

              m=re.search(r'<header class="tutorial-header">.*?</header>',s,re.S|re.I)
              if m:
                  block=m.group(0)
                  h=re.search(r'<h1[^>]*>(.*?)</h1>',block,re.S|re.I)
                  p=re.search(r'<p class="intro"[^>]*>(.*?)</p>',block,re.S|re.I)
                  title=clean(h.group(1)).strip() if h else 'Crochet Tutorial'
                  desc=clean(p.group(1)).strip() if p else title
                  s=s[:m.start()]+f'<div class="tutorial-hero"><div class="eyebrow">Sara Rain Crochet · Free Pattern</div><h1>{title}</h1><p class="lede">{desc}</p></div>'+s[m.end():]
                  # Move the first hero image into the new hero.
                  im=re.search(r'<img\b[^>]*class="hero-image"[^>]*>',s[m.end():],re.I)
                  if im:
                      pos=m.start()+len(f'<div class="tutorial-hero"><div class="eyebrow">Sara Rain Crochet · Free Pattern</div><h1>{title}</h1><p class="lede">{desc}</p></div>')
                      tag=im.group(0)
                      # remove standalone image and append it inside hero
                      s=s.replace(tag,'',1)
                      s=s[:pos]+tag+'\n</div>'+s[pos+len('</div>'):]

              m=re.search(r'<div class="hero">.*?</div>\s*<div class="facts">',s,re.S|re.I)
              if m and 'class="kicker"' in m.group(0):
                  block=m.group(0)
                  h=re.search(r'<h1[^>]*>(.*?)</h1>',block,re.S|re.I)
                  p=re.search(r'<p class="lede"[^>]*>(.*?)</p>',block,re.S|re.I)
                  im=re.search(r'<img\b[^>]*>',block,re.I)
                  title=clean(h.group(1)).strip() if h else 'Crochet Tutorial'
                  desc=clean(p.group(1)).strip() if p else title
                  tag=im.group(0) if im else ''
                  repl=f'<div class="tutorial-hero"><div class="eyebrow">Sara Rain Crochet · Free Pattern</div><h1>{title}</h1><p class="lede">{desc}</p>{tag}</div>\n<div class="facts">'
                  s=s[:m.start()]+repl+s[m.end():]

              m=re.search(r'<p class="meta">.*?</p>\s*<h1>(.*?)</h1>\s*<p class="dek">(.*?)</p>\s*(<img\b[^>]*>)',s,re.S|re.I)
              if m:
                  title=clean(m.group(1)).strip(); desc=clean(m.group(2)).strip(); tag=m.group(3)
                  repl=f'<div class="article-hero"><div class="meta">Sara Rain Crochet · Free Pattern</div><h1>{title}</h1><p class="dek">{desc}</p>{tag}</div>'
                  s=s[:m.start()]+repl+s[m.end():]
              return s

          changed=0
          for root in (Path('posts'),Path('public/posts')):
              if not root.exists(): continue
              for p in root.glob('*.html'):
                  if p.name in skip: continue
                  old=p.read_text(); new=normalize(old)
                  if new!=old: p.write_text(new); changed+=1
          print('Normalized',changed,'tutorial headers')

          # Make Quick Publisher normalize every future pasted tutorial too.
          p=Path('src/worker-v2.js')
          s=p.read_text()
          marker='function addMissingMeta(html,title,description,url,image){'
          if 'function normalizeTutorialHeader(html,title,description){' not in s:
              fn='''function normalizeTutorialHeader(html,title,description){\n  const eyebrow='<div class="eyebrow">Sara Rain Crochet · Free Pattern</div>';\n  const lede=`<p class="lede">${esc(description)}</p>`;\n  let h=html;\n  h=h.replace(/<p\\b[^>]*class=["']meta["'][^>]*>[\\s\\S]*?<\\/p>/i,eyebrow);\n  h=h.replace(/<p\\b[^>]*class=["']intro["'][^>]*>[\\s\\S]*?<\\/p>/i,lede);\n  h=h.replace(/<p\\b[^>]*class=["']dek["'][^>]*>[\\s\\S]*?<\\/p>/i,lede);\n  if(!/<div\\b[^>]*class=["'][^"']*eyebrow[^"']*["']/i.test(h)) h=h.replace(/(<h1\\b[^>]*>[\\s\\S]*?<\\/h1>)/i,`${eyebrow}$1`);\n  if(!/<p\\b[^>]*class=["']lede["']/i.test(h)) h=h.replace(/(<h1\\b[^>]*>[\\s\\S]*?<\\/h1>)/i,`$1${lede}`);\n  return h;\n}\n\n'''
              s=s.replace(marker,fn+marker,1)
          old='  html=addMissingMeta(html,title,description,url,image);'
          new='  html=addMissingMeta(html,title,description,url,image);\n  html=normalizeTutorialHeader(html,title,description);'
          if old in s and new not in s: s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts public/posts src/worker-v2.js
          if ! git diff --cached --quiet; then
            git commit -m "Match all tutorial headers to baby blanket style"
            git push
          fi
          git rm .github/workflows/finalize-tutorial-header-style.yml
          git commit -m "Remove one-time header style workflow"
          git push
