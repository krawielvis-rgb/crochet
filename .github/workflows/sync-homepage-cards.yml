name: Sync homepage tutorial cards

on:
  push:
    branches: [main]
    paths:
      - data/posts.json
      - data/sync-trigger.txt
      - .github/workflows/sync-homepage-cards.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update homepage cards
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import html

          data = json.loads(Path('data/posts.json').read_text())
          index = Path('index.html')
          text = index.read_text()
          marker = '<div class="pinterest-grid">'
          start = text.find(marker)
          if start == -1:
              raise SystemExit('Pinterest grid not found in index.html')

          additions = []
          for post in data:
              slug = str(post.get('slug') or '').strip()
              title = str(post.get('title') or '').strip()
              image = str(post.get('image') or '').strip()
              if not slug or not title or not image:
                  continue
              href = f'/posts/{slug}.html'
              if href in text:
                  continue
              additions.append(
                  f'      <a class="pinterest-card" href="{html.escape(href, quote=True)}">'
                  f'<img src="{html.escape(image, quote=True)}" alt="{html.escape(title, quote=True)}" loading="lazy">'
                  f'<div class="pinterest-card-content"><h3>{html.escape(title)}</h3>'
                  f'<span>Read tutorial →</span></div></a>\n'
              )

          if not additions:
              print('Homepage already contains every published tutorial.')
              raise SystemExit(0)

          text = text[:start + len(marker)] + '\n' + ''.join(additions) + text[start + len(marker):]
          index.write_text(text)
          print(f'Added {len(additions)} homepage card(s).')
          PY

      - name: Commit homepage changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage changes to commit."
            exit 0
          fi
          git commit -m "Sync homepage cards with published tutorials"
          git push
