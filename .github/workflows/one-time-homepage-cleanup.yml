name: One-time homepage cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove unwanted cards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          targets = [
              'crochet-sunglasses-case.html',
              'crochet-baby-blanket.html',
              'easy-crochet-baby-blanket-pattern-for-beginners-sara-rain-crochet.html',
          ]
          for target in targets:
              pattern = r'\s*<a class="pinterest-card" href="[^"]*' + re.escape(target) + r'">.*?</a>'
              s, n = re.subn(pattern, '', s, count=1, flags=re.S)
              print(target, 'removed:', n)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Remove unwanted homepage cards'
          git push
      - name: Delete this workflow
        if: always()
        run: |
          git rm .github/workflows/one-time-homepage-cleanup.yml || true
          git diff --cached --quiet || git commit -m 'Remove one-time homepage cleanup workflow'
          git push || true
