name: Remove legacy Adcash config

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove Adcash fallback from Vite config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('vite.config.js')
          text = p.read_text(encoding='utf-8')
          lines = [line for line in text.splitlines(True) if 'const adcash =' not in line and 'acscdn.com/script/aclib.js' not in line]
          text = ''.join(lines).replace('${adcash}', '')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/remove-legacy-adcash-config.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Remove legacy Adcash config"
            git push
          fi
