name: Remove HBAgency

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove HBAgency integration
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          skip = {'.git', '.github'}
          patterns = [
              r'<script\s+src=["\']https://d3u598arehftfk\.cloudfront\.net/prebid_hb_[^>]+></script>\s*',
              r'<link\s+rel=["\']stylesheet["\']\s+href=["\']https://hbagency\.it/cdn/stylehb\.css["\']\s*/?>\s*',
              r'<div class="info-ad">\s*<div class="hb-ad-inpage">\s*<div class="hb-ad-inner">\s*<div class="hbagency_cls[^>]*></div>\s*</div>\s*</div>\s*</div>',
              r'<div class="hb-ad-inpage">\s*<div class="hb-ad-inner">\s*<div class="hbagency_cls[^>]*></div>\s*</div>\s*</div>',
              r"<div id='hbagency_space_341646'></div>",
              r"<div id='HB_Footer_Close_hbagency_space_341644'><div id='HB_CLOSE_hbagency_space_341644'></div><div id='HB_OUTER_hbagency_space_341644'><div id='hbagency_space_341644'></div></div></div>",
              r"<div id='HB_Footer_Close_hbagency_space_341645'><div id='HB_CLOSE_hbagency_space_341645'></div><div id='HB_OUTER_hbagency_space_341645'><div id='hbagency_space_341645'></div></div></div>",
          ]

          for p in root.rglob('*'):
              if not p.is_file() or any(part in skip for part in p.parts):
                  continue
              if p.name in {'ads.txt'}:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              original = text
              for pattern in patterns:
                  text = re.sub(pattern, '', text, flags=re.I | re.S)
              text = re.sub(r'^\s*import\s+hbPlacementsPlugin\s+from\s+["\']\.\/src\/hb-placements\.js["\'];?\s*$', '', text, flags=re.M)
              text = text.replace('hbPlacementsPlugin, ', '').replace(', hbPlacementsPlugin', '')
              text = text.replace('hbPlacementsPlugin,', '').replace(',hbPlacementsPlugin', '')
              if text != original:
                  p.write_text(text, encoding='utf-8')

          for path in [Path('ads.txt'), Path('public/ads.txt'), Path('src/hb-placements.js')]:
              if path.exists():
                  path.unlink()

      - name: Verify no HBAgency references remain
        run: |
          if git grep -n -I -E 'hbagency|prebid_hb|HB_Footer_Close|stylehb\.css' -- . ':!\.github/workflows/remove-hbagency.yml'; then
            echo 'HBAgency references remain.'
            exit 1
          fi

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -f .github/workflows/remove-hbagency.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Remove HBAgency integration'
          git push origin HEAD:main
