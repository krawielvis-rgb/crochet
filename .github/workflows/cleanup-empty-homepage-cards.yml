name: Clean invalid homepage cards

on:
  push:
    branches: [main]
    paths:
      - index.html
      - public/images/pins/**
      - .github/workflows/cleanup-empty-homepage-cards.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove cards whose images do not exist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          text = index.read_text()

          card_re = re.compile(r'\s*<a class="pinterest-card".*?</a>\s*', re.S)
          removed = 0

          def clean(match):
              global removed
              card = match.group(0)
              image_match = re.search(r'<img[^>]+src=["\']([^"\']+)["\']', card, re.I)
              if not image_match:
                  removed += 1
                  return '\n'

              src = image_match.group(1)
              if src.startswith('/'):
                  image_path = Path('public') / src.lstrip('/')
                  if not image_path.is_file():
                      removed += 1
                      return '\n'

              return card

          cleaned = card_re.sub(clean, text)
          index.write_text(cleaned)
          print(f'Removed {removed} invalid homepage card(s).')
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No invalid cards found."
            exit 0
          fi
          git commit -m "Remove homepage cards with missing images"
          git push
