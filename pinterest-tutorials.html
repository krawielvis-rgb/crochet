<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pinterest Crochet Tutorials | Sara Rain Crochet</title>
  <meta name="description" content="Browse crochet tutorials created for Pinterest, with matching project images and beginner-friendly instructions.">
  <link rel="canonical" href="https://crochet.krawielvis.workers.dev/pinterest-tutorials.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Pinterest Crochet Tutorials | Sara Rain Crochet">
  <meta property="og:description" content="Browse crochet tutorials with matching Pinterest project images.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
  <style>
    .gallery{max-width:1180px;margin:0 auto;padding:80px 24px 100px}
    .gallery h1{font:600 clamp(44px,7vw,82px)/1 Fraunces,serif;margin:12px 0 20px}
    .gallery .intro{max-width:700px;font:20px/1.6 Fraunces,serif;color:#53635b;margin-bottom:45px}
    .pin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:26px}
    .pin-card{display:block;text-decoration:none;background:#fff;border:1px solid var(--line);color:inherit;overflow:hidden;transition:transform .2s,box-shadow .2s}
    .pin-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.08)}
    .pin-card img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover}
    .pin-card div{padding:18px 18px 21px}
    .pin-card h2{font:600 25px/1.1 Fraunces,serif;margin:0 0 8px}
    .pin-card p{font-size:14px;line-height:1.5;color:#69766f;margin:0 0 14px}
    .pin-card span{font:10px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:1px;color:var(--red)}
    .back{font:10px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:1px}
    .status{padding:20px;border:1px dashed var(--line);color:#69766f;margin-top:20px}
  </style>
</head>
<body>
  <header class="site-header">
    <a href="/" class="brand"><span class="brand-mark">S</span><span>Sara Rain Crochet</span></a>
    <nav><a href="/#learn">Learn</a><a href="/#patterns">Patterns</a><a href="/#stories">Stories</a></nav>
    <a class="button button-small" href="/">Home <span>↗</span></a>
  </header>

  <main class="gallery">
    <a class="back" href="/">← Back to Sara Rain Crochet</a>
    <h1>Pinterest Crochet Tutorials</h1>
    <p class="intro">One pin, one matching tutorial. New tutorials published from the admin are added here automatically.</p>
    <div id="pin-grid" class="pin-grid">
      <div class="status">Loading tutorials…</div>
    </div>
  </main>

  <footer>
    <a class="brand" href="/"><span class="brand-mark">S</span><span>Sara Rain Crochet</span></a>
    <p>For the pleasure of making.</p>
  </footer>

  <script>
    const grid=document.getElementById('pin-grid');
    const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    fetch('/api/posts',{cache:'no-store'})
      .then(r=>r.ok?r.json():Promise.reject(new Error('Could not load tutorials')))
      .then(posts=>{
        const items=posts.filter(p=>p&&p.published!==false);
        if(!items.length){grid.innerHTML='<div class="status">No tutorials published yet.</div>';return;}
        grid.innerHTML=items.map(p=>`<a class="pin-card" href="/posts/${encodeURIComponent(p.slug)}.html"><img src="${esc(p.image||('/images/pins/pin-'+p.slug+'.jpg'))}" alt="${esc(p.title)}" loading="lazy"><div><h2>${esc(p.title)}</h2><p>${esc(p.description||'Beginner-friendly crochet tutorial from Sara Rain Crochet.')}</p><span>Read tutorial →</span></div></a>`).join('');
      })
      .catch(()=>{grid.innerHTML='<div class="status">Tutorials are temporarily unavailable. Please refresh the page.</div>';});
  </script>
</body>
</html>
